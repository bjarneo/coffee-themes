<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Desktop preview</title>
<style>
/* A 1920x1080 Omarchy desktop: the top bar, Neovim, a theme panel and a shot
   timer. tools/preview.mjs calls paint() and takes a screenshot. The sizes
   follow the Omarchy defaults: gaps 5 and 10, border 2, rounding 0. */
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body {
  font: 15px/1.5 "JetBrainsMono Nerd Font", "JetBrains Mono", monospace;
  color: var(--fg); background: var(--bg) center / cover no-repeat;
  -webkit-font-smoothing: antialiased;
}
.bar {
  height: 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 14px; background: var(--bg); color: var(--fg); font-size: 13px;
}
.bar .ws { display: flex; gap: 14px; align-items: center; }
.bar .ws span { color: var(--dfg); }
.bar .ws .on { color: var(--fg); font-weight: 700; }
.bar .ws .logo { color: var(--accent); font-size: 15px; margin-right: 4px; }
.bar .right { display: flex; gap: 16px; justify-content: flex-end; color: var(--fg); }
.tiles { position: absolute; top: 38px; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: 1.08fr 1fr; gap: 10px; }
.col { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
.win { position: relative; min-height: 0; overflow: hidden; background: var(--win); border: 2px solid var(--inactive); }
.win.active { border: 2px solid transparent; background: linear-gradient(var(--win), var(--win)) padding-box, linear-gradient(45deg, var(--accent), var(--second)) border-box; }

/* Neovim */
.nv { display: grid; grid-template-rows: 26px 1fr 26px 22px; height: 100%; }
.tabs { display: flex; background: var(--darker); font-size: 14px; }
.tabs span { padding: 3px 16px; color: var(--dfg); }
.tabs .cur { background: var(--bgsolid); color: var(--fg); border-top: 2px solid var(--accent); padding-top: 1px; }
.code { padding: 6px 0; overflow: hidden; }
.ln { display: grid; grid-template-columns: 58px 1fr; white-space: pre; height: 22.5px; }
.ln .n { text-align: right; padding-right: 18px; color: var(--muted); }
.ln.cur { background: var(--lighter); }
.ln.cur .n { color: var(--yellow); font-weight: 700; }
.status { display: flex; align-items: center; background: var(--darker); font-size: 13.5px; }
.status .mode { background: var(--accent); color: var(--bgsolid); font-weight: 800; padding: 3px 14px; }
.status span { padding: 3px 12px; color: var(--fg); }
.status .dim { color: var(--dfg); }
.status .fill { flex: 1; }
.status .pos { background: var(--accent); color: var(--bgsolid); font-weight: 700; padding: 3px 14px; }
.cmd { font-size: 13.5px; color: var(--dfg); padding: 1px 12px; }
.c { color: var(--muted); font-style: italic; }
.k { color: var(--magenta); }
.s { color: var(--green); }
.nm { color: var(--orange); }
.f { color: var(--blue); }
.t { color: var(--yellow); }
.p { color: var(--cyan); }
.o { color: var(--dfg); }
.cursor { background: var(--bfg); color: var(--bgsolid); }

/* Boxes like btop */
.pad { padding: 16px 18px; height: 100%; display: flex; flex-direction: column; gap: 12px; }
.box { position: relative; border: 1px solid var(--muted); border-radius: 6px; padding: 14px 16px 12px; }
.box > .title { position: absolute; top: -11px; left: 12px; padding: 0 6px; background: var(--bgsolid); color: var(--accent); font-weight: 700; }
.box > .title b { color: var(--fg); }
.box > .tag { position: absolute; top: -11px; right: 12px; padding: 0 6px; background: var(--bgsolid); color: var(--dfg); }
.sw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 6px 0 10px; }
.sw i { height: 26px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
.kv { display: grid; grid-template-columns: 110px 1fr 110px 1fr; row-gap: 2px; }
.kv .key { color: var(--dfg); }
.meter { display: flex; align-items: center; gap: 12px; }
.meter .track { flex: 1; height: 10px; border-radius: 5px; background: var(--lighter); overflow: hidden; }
.meter .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--second)); }
.big { font-size: 46px; font-weight: 800; line-height: 1; color: var(--fg); letter-spacing: 2px; }
.flow { display: flex; align-items: flex-end; gap: 5px; height: 110px; }
.flow i { flex: 1; border-radius: 2px 2px 0 0; }
.row2 { display: flex; gap: 12px; }
.row2 > .box { flex: 1; }
.log div { white-space: pre; }
.prompt { color: var(--fg); }
.prompt .u { color: var(--green); }
.prompt .d { color: var(--blue); }
.prompt .b { color: var(--magenta); }
</style>
</head>
<body>
<div class="bar">
  <div class="ws"><span class="logo">󱄅</span><span>1</span><span>2</span><span class="on">3</span><span>4</span><span>5</span></div>
  <div class="center" id="clock"></div>
  <div class="right"><span>󰂯</span><span>󰖩</span><span>󰕾</span><span>󰍛</span><span>󰁹 86%</span></div>
</div>
<div class="tiles">
  <section class="win active" id="nvim"></section>
  <div class="col">
    <section class="win" id="theme"></section>
    <section class="win" id="brew"></section>
  </div>
</div>
<script>
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const camel = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').replace(/[^A-Za-z0-9]+(.)/g, (_, c) => c.toUpperCase()).replace(/^./, c => c.toLowerCase());
function lum(hex) { const v = [1, 3, 5].map(i => { const x = parseInt(hex.slice(i, i + 2), 16) / 255; return x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
function rgba(hex, a) { const n = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return `rgba(${n[0]},${n[1]},${n[2]},${a})`; }

// A small TypeScript highlighter: enough for the recipe file.
const KEYWORDS = new Set(['import', 'from', 'export', 'const', 'async', 'function', 'return', 'await', 'type', 'interface', 'if', 'for', 'of', 'new', 'let']);
function highlight(line) {
  const out = [];
  const re = /(\/\/.*$|\/\*\*.*$|^\s*\*.*$)|('[^']*'|`[^`]*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|(\s+)|(.)/g;
  let m;
  while ((m = re.exec(line))) {
    const [tok, com, str, num, id, ws] = m;
    if (com) out.push(`<span class="c">${esc(tok)}</span>`);
    else if (str) out.push(`<span class="s">${esc(tok)}</span>`);
    else if (num) out.push(`<span class="nm">${tok}</span>`);
    else if (id) {
      const after = line.slice(re.lastIndex);
      if (KEYWORDS.has(id)) out.push(`<span class="k">${id}</span>`);
      else if (/^[A-Z]/.test(id)) out.push(`<span class="t">${id}</span>`);
      else if (/^\s*\(/.test(after)) out.push(`<span class="f">${id}</span>`);
      else if (/^\s*:/.test(after) && !/^\s*::/.test(after)) out.push(`<span class="p">${id}</span>`);
      else out.push(esc(id));
    } else if (ws) out.push(tok);
    else out.push(`<span class="o">${esc(tok)}</span>`);
  }
  return out.join('');
}

function recipeCode(t) {
  const id = camel(t.base);
  const total = t.layers.filter(([n]) => n !== 'ice').reduce((a, [, p]) => a + p, 0);
  const lines = [
    `import { type Recipe, pull, steam, pour } from '../barista';`,
    ``,
    `/** ${t.desc} */`,
    `export const ${id}: Recipe = {`,
    `  name: '${t.base}',`,
    `  category: '${t.cat}',`,
    `  vessel: '${t.vessel}',`,
    `  roast: ${t.roast.toFixed(2)},`,
    `  layers: [`,
    ...t.layers.map(([n, p]) => n === 'ice' ? `    { ingredient: 'ice', parts: 0 },` : `    { ingredient: '${n}', parts: ${p} }, // ${Math.round(p / total * 100)}%`),
    `  ],`,
    `};`,
    ``,
    `export async function make(dose = 18): Promise<Cup> {`,
    `  const shot = await pull(dose, { ratio: 2, temp: 93 });`,
    `  const milk = steam({ target: 60, foam: 0.5 });`,
    `  for (const layer of ${id}.layers) {`,
    `    if (layer.parts === 0) continue;`,
    `    await pour(layer, { into: ${id}.vessel });`,
    `  }`,
    `  return new Cup(${id}, shot, milk);`,
    `}`,
  ];
  return lines;
}

function nvim(t) {
  const file = `${t.slug.replace(/-(night|day)$/, '')}.ts`;
  const lines = recipeCode(t);
  const cur = Math.min(lines.length - 1, 15);
  const body = lines.map((l, i) => {
    let html = highlight(l);
    if (i === cur) html = html.replace(/(<span class="f">)(\w)/, '$1<span class="cursor">$2</span>');
    return `<div class="ln${i === cur ? ' cur' : ''}"><span class="n">${i === cur ? i + 1 : Math.abs(i - cur)}</span><span>${html || ' '}</span></div>`;
  }).join('');
  const filler = Array.from({ length: 40 - lines.length }, () => `<div class="ln"><span class="n" style="color:var(--lighter)">~</span><span></span></div>`).join('');
  return `<div class="nv">
    <div class="tabs"><span class="cur">󰛦 ${file}</span><span>barista.ts</span><span>README.md</span></div>
    <div class="code">${body}${filler}</div>
    <div class="status"><span class="mode">NORMAL</span><span> main</span><span class="dim">recipes/${file}</span><span class="fill"></span><span class="dim">utf-8</span><span class="dim">typescript</span><span class="pos">${cur + 1}:5</span></div>
    <div class="cmd">"recipes/${file}" ${lines.length}L written</div>
  </div>`;
}

function themePanel(t) {
  const c = t.colors, ratio = contrast(c.foreground, c.background);
  const grade = ratio >= 7 ? 'AAA' : ratio >= 4.5 ? 'AA' : '';
  return `<div class="pad">
    <div class="box"><span class="title">¹<b>theme</b></span><span class="tag">${t.variant}</span>
      <div style="display:flex;justify-content:space-between"><b style="color:var(--accent)">${esc(t.slug)}</b><span style="color:var(--dfg)">omarchy · active</span></div>
      <div class="sw">${t.ansi.map(h => `<i style="background:${h}"></i>`).join('')}</div>
      <div class="kv">
        <span class="key">accent</span><span>${c.accent}</span><span class="key">bg</span><span>${c.background}</span>
        <span class="key">fg</span><span>${c.foreground}</span><span class="key">select</span><span>${c.selection}</span>
        <span class="key">icons</span><span>${t.icons}</span><span class="key">mode</span><span>${c.mode}</span>
      </div>
      <div class="meter" style="margin-top:10px"><span class="key" style="color:var(--dfg)">contrast</span><span class="track"><i style="width:${Math.min(100, ratio / 21 * 100 * 1.4)}%"></i></span><span>${ratio.toFixed(1)} ${grade}</span></div>
    </div>
    <div class="row2">
      <div class="box"><span class="title">²<b>font</b></span>JetBrainsMono Nerd Font<br><span style="color:var(--dfg)">size 9 · ligatures on</span></div>
      <div class="box"><span class="title">³<b>wall</b></span>1-latte-art.jpg<br><span style="color:var(--dfg)">5 backgrounds · 6144×3456</span></div>
    </div>
    <div class="log" style="color:var(--dfg)">
      <div><span class="prompt"><span class="u">coffee</span> in <span class="d">~/brew</span> on <span class="b"> main</span></span></div>
      <div><span style="color:var(--green)">❯</span> <span style="color:var(--fg)">omarchy theme set ${esc(t.slug)}</span></div>
    </div>
  </div>`;
}

function brewPanel(t, r) {
  const bars = Array.from({ length: 40 }, (_, i) => {
    const x = i / 39, h = x < .15 ? x / .15 * .35 : .35 + .6 * Math.sin(Math.min(1, (x - .15) / .5) * Math.PI / 2) - (x > .85 ? (x - .85) * 2.5 : 0);
    const col = x < .2 ? 'var(--cyan)' : x < .75 ? 'var(--accent)' : 'var(--orange)';
    return `<i style="height:${Math.max(4, (h + (r() - .5) * .06) * 100)}%;background:${col}"></i>`;
  }).join('');
  const log = [
    ['09:12', 'ok  ', 'green', '18.0 g → 36.4 g', '27 s'],
    ['09:05', 'fast', 'yellow', '18.0 g → 41.0 g', '19 s'],
    ['08:58', 'slow', 'red', '18.0 g → 30.2 g', '38 s'],
    ['08:51', 'ok  ', 'green', '18.5 g → 37.0 g', '28 s'],
  ];
  return `<div class="pad">
    <div class="box" style="flex:1"><span class="title">⁴<b>shot</b></span><span class="tag">${esc(t.base.toLowerCase())}</span>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px">
        <div><div class="big">00:27</div><div style="color:var(--dfg);margin-top:6px">extraction time</div></div>
        <div style="text-align:right;line-height:1.7"><span style="color:var(--dfg)">dose</span> 18.0 g · <span style="color:var(--dfg)">yield</span> 36.4 g<br><span style="color:var(--dfg)">ratio</span> <span style="color:var(--yellow)">1:2.0</span> · <span style="color:var(--dfg)">temp</span> <span style="color:var(--red)">93 °C</span> · <span style="color:var(--dfg)">pressure</span> <span style="color:var(--blue)">9 bar</span></div>
      </div>
      <div class="flow">${bars}</div>
    </div>
    <div class="box log"><span class="title">⁵<b>log</b></span>${log.map(([tm, st, col, g, s]) => `<div><span style="color:var(--dfg)">${tm}</span>  <span style="color:var(--${col})">${st}</span>  ${g}  <span style="color:var(--magenta)">${s}</span></div>`).join('')}</div>
  </div>`;
}

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

window.paint = async (t, wallpaper) => {
  const c = t.colors, light = c.mode === 'light';
  const vars = {
    '--bg': `url("${wallpaper}")`, '--bgsolid': c.background, '--win': rgba(c.background, light ? .93 : .9), '--fg': c.foreground, '--dfg': c.dark_foreground,
    '--bfg': c.bright_foreground, '--muted': c.muted, '--accent': c.accent, '--second': t.second, '--inactive': rgba(c.muted, .67),
    '--darker': c.dark_background, '--lighter': c.lighter_background, '--red': c.red, '--green': c.green, '--yellow': c.yellow,
    '--blue': c.blue, '--magenta': c.magenta, '--cyan': c.cyan, '--orange': c.orange,
  };
  Object.entries(vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  document.body.style.backgroundImage = `url("${wallpaper}")`;
  document.querySelector('.bar').style.background = c.background;
  document.getElementById('clock').textContent = 'Sunday 09:41';
  document.getElementById('nvim').innerHTML = nvim(t);
  document.getElementById('theme').innerHTML = themePanel(t);
  document.getElementById('brew').innerHTML = brewPanel(t, rng(t.index * 31 + (light ? 7 : 0)));
  await document.fonts.ready;
  await new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = wallpaper; });
  // A background tab gets no animation frames, so wait with a timer.
  await new Promise(res => setTimeout(res, 60));
  return true;
};
</script>
</body>
</html>
