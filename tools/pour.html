<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pour renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<script>
// Frames of the creamy pour, the transition of the promo video.
// tools/pour.mjs calls renderPour() once for each frame of one pour:
//   mask  white above the wavy edge, black below it. ffmpeg shows the next
//         background where the mask is white.
//   edge  the milk front along the edge: white, with the cream in the alpha.
// The frames do not depend on the theme, so they serve every theme.

const W = 3840, H = 2160;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

function inout(t) { t = Math.max(0, Math.min(1, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

// The edge starts above the frame and ends below it. Two sine waves that
// move with the frame number keep it alive, like milk that flows.
function wave(f, n) {
  const p = inout(f / (n - 1)), y0 = -140 + p * (H + 280);
  return x => y0 + Math.sin(x / 320 + f * .35) * 44 + Math.sin(x / 122 - f * .5) * 18;
}

function path(y) {
  ctx.beginPath();
  for (let x = 0; x <= W; x += 16) x ? ctx.lineTo(x, y(x)) : ctx.moveTo(x, y(x));
}

window.renderPour = (kind, f, n) => {
  const y = wave(f, n);
  ctx.clearRect(0, 0, W, H);
  if (kind === 'mask') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    path(y); ctx.lineTo(W, 0); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
  } else {
    // A soft wide cream band, then the bright front line
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    path(y); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 64; ctx.filter = 'blur(28px)'; ctx.stroke();
    path(y); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 22; ctx.filter = 'blur(3px)'; ctx.stroke();
    ctx.filter = 'none';
  }
  return cv.toDataURL('image/png');
};
</script>
</body>
</html>
