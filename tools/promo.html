<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Promo renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Promo video frames. tools/promo.mjs calls setup(), prepare() and frame().
// Segments: intro, the 5 backgrounds, night and day, a card for each
// category, one beat for each drink, and the outro. Nothing zooms: images
// stay still, and only the pour, fades and slides move.
//
// The screenshots come from tools/capture.sh at the shape of the screen. A
// frame shows the whole screenshot at full height, and the bars at the sides
// hold the 16 ANSI colors.

const W = 1920, H = 1080;
const MONO = '"JetBrainsMono Nerd Font", "JetBrains Mono", monospace';
const SERIF = '"Noto Serif", serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let S = null, LOGO = [], images = new Map(), stills = {};

function rgb(hex) { return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); }
function rgba(hex, a) { const n = rgb(hex); return `rgba(${n[0]},${n[1]},${n[2]},${a})`; }
function ease(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
function inout(t) { t = Math.max(0, Math.min(1, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function load(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }

window.setup = async (config) => {
  S = config;
  LOGO = config.logo.map(p => ({ path: new Path2D(p.d), rule: p.evenodd ? 'evenodd' : 'nonzero' }));
  stills.wall = await load(config.wall);
  stills.backgrounds = await Promise.all(config.backgrounds.map(b => load(b.src)));
  stills.hero = await Promise.all(config.hero.map(load));
  await document.fonts.load(`40px ${MONO}`);
  await document.fonts.load(`bold 40px ${MONO}`);
  await document.fonts.load(`300 40px ${SERIF}`);
  await document.fonts.load(`italic 300 40px ${SERIF}`);
};

// Keeps the screenshots of the current and the next clip in memory only.
window.prepare = async (j) => {
  for (const k of [...images.keys()]) if (k < j - 1) images.delete(k);
  for (const k of [j, j + 1]) {
    if (k < S.clips.length && !images.has(k)) images.set(k, await Promise.all([load(S.clips[k].src.night), load(S.clips[k].src.day)]));
  }
};

function drawLogo(x, y, width, fill, alpha = 1) {
  const s = width / 1215;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = fill; LOGO.forEach(p => ctx.fill(p.path, p.rule));
  ctx.restore();
}

function text(str, x, y, size, color, opts = {}) {
  ctx.save();
  ctx.font = `${opts.italic ? 'italic ' : ''}${opts.weight || (opts.bold ? 'bold' : '')} ${size}px ${opts.font || MONO}`;
  ctx.fillStyle = color; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = opts.baseline || 'alphabetic';
  if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = opts.blur || 24; }
  if (opts.alpha !== undefined) ctx.globalAlpha = Math.max(0, Math.min(1, opts.alpha));
  if (opts.spacing) ctx.letterSpacing = opts.spacing;
  ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}

// Draws an image so that it covers the whole frame.
function cover(img, alpha = 1) {
  const s = Math.max(W / img.width, H / img.height);
  const w = img.width * s, h = img.height * s;
  ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); ctx.restore();
}

// Draws a screenshot at full height in the middle of the frame. The bars at
// the sides take the darker background of the theme, with the 8 normal ANSI
// colors on the left and the 8 bright colors on the right.
function screen(img, t) {
  const w = Math.min(W, img.width * H / img.height), x = (W - w) / 2;
  ctx.fillStyle = t.colors.darker_background; ctx.fillRect(0, 0, W, H);
  if (x > 40) {
    const sq = 40, gap = 14, y0 = (H - (8 * sq + 7 * gap)) / 2;
    for (let k = 0; k < 8; k++) {
      ctx.fillStyle = t.ansi[k]; ctx.fillRect(x / 2 - sq / 2, y0 + k * (sq + gap), sq, sq);
      ctx.fillStyle = t.ansi[k + 8]; ctx.fillRect(W - x / 2 - sq / 2, y0 + k * (sq + gap), sq, sq);
    }
  }
  ctx.drawImage(img, x, 0, w, H);
  return x;
}

function fadeIn(f, frames = 6) { const a = 1 - f / frames; if (a > 0) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); } }

// The chip in the top right corner.
function chip(t, alpha = 1, right = 60) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `bold 22px ${MONO}`;
  const label = '82 drinks × night and day', w = ctx.measureText(label).width + 40;
  ctx.fillStyle = rgba(t.colors.background, .92); ctx.beginPath(); ctx.roundRect(W - right - w, 36, w, 50, 25); ctx.fill();
  ctx.strokeStyle = t.colors.accent; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = t.colors.foreground; ctx.textBaseline = 'middle'; ctx.fillText(label, W - right + 20 - w, 62);
  ctx.restore();
}

function intro(f, n) {
  const t = S.intro;
  cover(stills.hero[0]);
  ctx.fillStyle = rgba(t.colors.darker_background, .72); ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .4, 0, W / 2, H * .4, W * .55);
  g.addColorStop(0, rgba(t.colors.accent, .16 * ease(f / 20))); g.addColorStop(1, rgba(t.colors.accent, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const width = 780, a = ease((f - 4) / 14);
  const grad = ctx.createLinearGradient(0, 0, 1215, 0);
  grad.addColorStop(0, t.colors.accent); grad.addColorStop(1, t.second);
  ctx.save(); ctx.shadowColor = rgba('#000000', .6); ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  drawLogo((W - width) / 2, H * .27 - width * 285 / 1215 / 2, width, grad, a); ctx.restore();
  const steps = [['82 coffee themes', 26, 64, t.colors.foreground, false], ['× night and day', 50, 64, t.colors.foreground, true], ['= 164 Omarchy themes', 74, 84, t.colors.accent, false]];
  steps.forEach(([label, start, size, color, italic], i) => {
    text(label, W / 2, H * (.53 + i * .12), size, color, { align: 'center', font: SERIF, weight: '300', italic, alpha: ease((f - start) / 12), glow: 'rgba(0,0,0,.7)', blur: 30 });
  });
  fadeIn(f, 10);
}

// The 5 backgrounds of one variant, one per beat.
function backgrounds(seg, f, n) {
  const b = S.backgrounds[seg.i], img = stills.backgrounds[seg.i], t = S.intro;
  cover(img);
  const a = ease(f / 6);
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, H * .55, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  text(`5 backgrounds per variant  ·  ${seg.i + 1} / 5`, 96, H - 150, 26, '#f3e9dd', { alpha: a, spacing: '3px' });
  text(b.label, 92, H - 70, 76, '#ffffff', { font: SERIF, weight: '300', alpha: a, glow: 'rgba(0,0,0,.6)', blur: 30 });
  chip(t, a);
}

// The pour: the day frame fills in from the top, behind a wavy edge of milk.
function pour(night, day, tn, td, p, f) {
  screen(night, tn);
  if (p <= 0) return;
  const y0 = -60 + p * (H + 160);
  const wave = x => y0 + Math.sin(x / 160 + f * .35) * 22 + Math.sin(x / 61 - f * .5) * 9;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0);
  for (let x = W; x >= 0; x -= 20) ctx.lineTo(x, wave(x));
  ctx.closePath(); ctx.clip();
  screen(day, td);
  ctx.restore();
  if (p < 1) {
    const edge = td.colors.background;
    ctx.save(); ctx.beginPath();
    for (let x = 0; x <= W; x += 20) x ? ctx.lineTo(x, wave(x)) : ctx.moveTo(x, wave(x));
    ctx.strokeStyle = rgba(edge, .9); ctx.lineWidth = 10; ctx.shadowColor = rgba(edge, .8); ctx.shadowBlur = 24; ctx.stroke();
    ctx.restore();
  }
}

function label(t, top, name, pill, a, x0) {
  ctx.save(); ctx.font = `300 66px ${SERIF}`; const nameW = ctx.measureText(name).width; ctx.restore();
  ctx.save(); ctx.font = `22px ${MONO}`; ctx.letterSpacing = '2px'; const topW = ctx.measureText(top).width; ctx.restore();
  const bx = x0 + 36 - (1 - a) * 40, bh = 186, by = H - 56 - bh, bw = Math.max(nameW + 170, topW) + 72;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = rgba(t.colors.background, .94); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 18); ctx.fill();
  const border = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  border.addColorStop(0, t.colors.accent); border.addColorStop(1, t.second);
  ctx.lineWidth = 3; ctx.strokeStyle = border; ctx.stroke();
  ctx.restore();
  text(top, bx + 36, by + 48, 22, t.colors.dark_foreground, { alpha: a, spacing: '2px' });
  text(name, bx + 32, by + 124, 66, t.colors.foreground, { font: SERIF, weight: '300', alpha: a });
  ctx.save(); ctx.globalAlpha = a; ctx.font = `bold 20px ${MONO}`;
  const pw = ctx.measureText(pill).width + 30, px = bx + 40 + nameW + 10, py = by + 88;
  ctx.fillStyle = t.colors.accent; ctx.beginPath(); ctx.roundRect(px, py, pw, 38, 19); ctx.fill();
  ctx.fillStyle = t.colors.background; ctx.textBaseline = 'middle'; ctx.fillText(pill, px + 15, py + 20);
  ctx.restore();
  t.ansi.forEach((h, k) => { ctx.globalAlpha = a; ctx.fillStyle = h; ctx.fillRect(bx + 36 + k * ((bw - 72) / 16), by + bh - 34, (bw - 72) / 16 - 3, 10); });
  ctx.globalAlpha = 1;
}

function nightAndDay(seg, f, n) {
  const p = seg.part === 0 ? 0 : inout(f / (n * .6));
  pour(stills.hero[1], stills.hero[2], S.intro, S.introDay, p, f);
  const t = p > .5 ? S.introDay : S.intro;
  const x0 = (W - Math.min(W, stills.hero[1].width * H / stills.hero[1].height)) / 2;
  label(t, 'EVERY DRINK HAS 2 VARIANTS', p > .5 ? 'Day' : 'Night', 'cappuccino', ease(f / 6), x0);
  chip(t, ease(f / 6), x0 + 40);
}

function section(seg, f, n) {
  const t = seg.theme;
  ctx.fillStyle = t.colors.background; ctx.fillRect(0, 0, W, H);
  // The 16 colors pour down as vertical stripes on the right
  for (let k = 0; k < 16; k++) {
    const d = ease((f - k * .5) / 9);
    ctx.fillStyle = t.ansi[k]; ctx.fillRect(W - 16 * 34 - 120 + k * 34, 0, 34, H * d);
  }
  const a = ease(f / 6);
  text(`${seg.part} / 7`, 120, H * .36, 30, t.colors.dark_foreground, { alpha: a, spacing: '6px' });
  ctx.save(); ctx.font = `300 140px ${SERIF}`; const w = ctx.measureText(seg.label).width; ctx.restore();
  const size = Math.min(140, 140 * 1060 / w);
  text(seg.label, 112, H * .36 + 40 + size, size, t.colors.foreground, { font: SERIF, weight: '300', alpha: a });
  ctx.fillStyle = t.colors.accent; ctx.globalAlpha = a; ctx.fillRect(120, H * .36 + 90 + size, 160 * ease((f - 3) / 8), 8); ctx.globalAlpha = 1;
  text(`${seg.count} drinks`, 120, H * .36 + 170 + size, 34, t.colors.dark_foreground, { alpha: ease((f - 4) / 8), spacing: '3px' });
  chip(t, a);
}

function clip(j, f, n) {
  const c = S.clips[j], [night, day] = images.get(j);
  // The pour starts at 40 percent of the beat and ends at 80 percent.
  const p = inout((f / n - .4) / .4);
  pour(night, day, c.night, c.day, p, f);
  const t = p > .5 ? c.day : c.night;
  const x0 = (W - Math.min(W, night.width * H / night.height)) / 2;
  label(t, `${c.category.toUpperCase()}  ·  ${String(c.index).padStart(2, '0')} / 82`, c.name, p > .5 ? 'day' : 'night', ease(f / 5), x0);
  chip(t, 1, x0 + 40);
  const prog = (j + f / n) / S.clips.length;
  ctx.fillStyle = rgba(t.colors.background, .7); ctx.fillRect(0, H - 8, W, 8);
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, t.colors.accent); g.addColorStop(1, t.second);
  ctx.fillStyle = g; ctx.fillRect(0, H - 8, W * prog, 8);
}

function outro(f, n) {
  const t = S.intro;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  cover(stills.wall, ease(f / 8));
  ctx.fillStyle = rgba(t.colors.darker_background, .8 * ease((f - 10) / 12)); ctx.fillRect(0, 0, W, H);
  const b = ease((f - 14) / 10);
  const grad = ctx.createLinearGradient(0, 0, 1215, 0);
  grad.addColorStop(0, t.colors.accent); grad.addColorStop(1, t.second);
  drawLogo((W - 560) / 2, H * .17, 560, grad, b);
  text('164 themes', W / 2, H * .5, 120, t.colors.foreground, { align: 'center', font: SERIF, weight: '300', alpha: b, glow: 'rgba(0,0,0,.8)', blur: 30 });
  text('82 drinks  ×  night and day  ·  820 backgrounds at 6K', W / 2, H * .6, 30, t.colors.dark_foreground, { align: 'center', alpha: ease((f - 22) / 10) });
  text(S.url, W / 2, H * .71, 40, t.colors.accent, { align: 'center', bold: true, alpha: ease((f - 28) / 10) });
  text(`curl -fsSL https://${S.url}/install.sh | bash -s -- mocha --set`, W / 2, H * .8, 24, t.colors.foreground, { align: 'center', alpha: ease((f - 34) / 10) });
  const end = f > n - 18 ? (f - (n - 18)) / 18 : 0;
  if (end > 0) { ctx.fillStyle = `rgba(0,0,0,${end})`; ctx.fillRect(0, 0, W, H); }
}

window.frame = (seg, f, n, quality = .92) => {
  if (seg.kind === 'intro') intro(f, n);
  else if (seg.kind === 'backgrounds') backgrounds(seg, f, n);
  else if (seg.kind === 'nightday') nightAndDay(seg, f, n);
  else if (seg.kind === 'section') section(seg, f, n);
  else if (seg.kind === 'outro') outro(f, n);
  else clip(seg.index, f, n);
  return cv.toDataURL('image/jpeg', quality);
};
</script>
</body>
</html>
